name: Resesh terminal ABI

on:
  push:
    branches: [resesh-abi-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 30ef65cad98f08e7197c9a1656fbd871bcb72f2d
          path: .vcpkg
          fetch-depth: 0

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          & .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore NuGet dependencies
        shell: pwsh
        run: |
          & .\dep\nuget\nuget.exe restore .\dep\nuget\packages.config -PackagesDirectory .\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Microsoft.Terminal.Control
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
            Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild was not found." }
          & $msbuild .\OpenConsole.sln /t:Terminal\Control\Microsoft_Terminal_Control `
            /m /p:Configuration=Release /p:Platform=${{ matrix.architecture }} `
            /p:AppxSymbolPackageEnabled=false /p:OpenConsoleDir="$PWD\" `
            /p:SolutionDir="$PWD\" /p:VcpkgRoot="$PWD\.vcpkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and run resesh ABI tests
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe |
            Select-Object -First 1
          & $msbuild .\src\cascadia\UnitTests_Control\Control.UnitTests.vcxproj `
            /m /p:Configuration=Release /p:Platform=x64 `
            /p:AppxSymbolPackageEnabled=false /p:OpenConsoleDir="$PWD\" `
            /p:SolutionDir="$PWD\" /p:VcpkgRoot="$PWD\.vcpkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RESESH_TEST_DLL = Join-Path $PWD "bin\x64\Release\Microsoft.Terminal.Control\Microsoft.Terminal.Control.dll"
          & .\build\scripts\Run-Tests.ps1 "Control.Unit.Tests.dll" x64 Release `
            -AdditionalTaefArguments "/name:*ReseshTerminalAbiTests*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect ABI artifact
        shell: pwsh
        run: |
          $source = Join-Path $PWD "bin\${{ matrix.architecture }}\Release\Microsoft.Terminal.Control"
          $destination = Join-Path $PWD "artifact\${{ matrix.architecture }}"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item "$source\Microsoft.Terminal.Control.dll" $destination
          Copy-Item "$source\Microsoft.Terminal.Control.pdb" $destination
          Copy-Item .\LICENSE $destination
          Get-FileHash "$destination\Microsoft.Terminal.Control.dll" -Algorithm SHA256 |
            Select-Object Algorithm, Hash, Path | ConvertTo-Json |
            Set-Content "$destination\sha256.json"

      - uses: actions/upload-artifact@v4
        with:
          name: resesh-terminal-${{ matrix.architecture }}
          path: artifact/${{ matrix.architecture }}
          if-no-files-found: error
